name: Publish TTF News website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build unchanged UI for the project URL
        working-directory: frontend
        run: |
          npm ci
          export VITE_BASE_PATH="$(node -p "require('../deployment/public.json').pages_base")"
          export VITE_TTF_API_BASE="$(node -p "require('../deployment/public.json').api_base")"
          export VITE_TTF_SNAPSHOT_BASE="${VITE_BASE_PATH}snapshot/"
          npm test
          npm run build -- --outDir dist-pages
          touch dist-pages/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
